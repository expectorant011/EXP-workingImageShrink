<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이미지 30x30 / 500KB 변환기</title>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<style>
  :root {
    /* "쯔바" 테마(쯔바_테마.json)의 win98Colors 팔레트 - 코코도우미 테마편집기와 동일한 색상 */
    --surface:#ffebee; --face:#fffafb; --highlight:#fefafb;
    --shadow:#cb2a4a; --frame:#ff4d6d;
    --title-l:#ff6b89; --title-r:#fff4d6; --title-text:#ffffff;
    --text:#4a3f3f; --text-dim:#6a3840;
    --accent:#fe7c96; --accent-light:#ffcccc;
    --field-bg:#fff5f5; --scroll-thumb:#dedede; --scroll-track:#ffffff;
    --danger:#c04040;
    --border-r: inset -1px -1px var(--frame), inset 1px 1px var(--highlight);
    --border-ri: inset -2px -2px var(--shadow), inset 2px 2px var(--face);
    --border-s: inset -1px -1px var(--highlight), inset 1px 1px var(--frame);
    --border-si: inset -2px -2px var(--face), inset 2px 2px var(--shadow);
    --border-w: inset -1px -1px var(--frame), inset 1px 1px var(--face);
    --border-wi: inset -2px -2px var(--shadow), inset 2px 2px var(--highlight);
    --bg: #ffcccc;
    font-family:"굴림","Gulim","MS Sans Serif",Arial,sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    -webkit-font-smoothing: none;
    padding: 24px 16px 64px;
  }
  ::-webkit-scrollbar { width: 16px; height: 16px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); box-shadow: var(--border-r), var(--border-ri); }
  .wrap { max-width: 760px; margin: 0 auto; }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; margin: -24px -16px 16px;
    background: linear-gradient(90deg, var(--title-l), var(--title-r));
    border-bottom: 2px solid var(--frame);
  }
  .titlebar h1 { font-size: 18px; margin: 0; font-weight: 900; color: var(--title-text); letter-spacing: .3px; }
  p.desc { color: var(--text-dim); margin-top: 0; margin-bottom: 16px; font-size: 12px; line-height: 1.6; padding: 0 2px; }
  .card { background: var(--surface); box-shadow: var(--border-w), var(--border-wi); padding: 0 14px 14px; margin-bottom: 16px; }
  .card-title {
    font-size: 12px; color: var(--title-text); margin: 0 -14px 12px; font-weight: 700;
    padding: 3px 6px; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(90deg, var(--title-l), var(--title-r));
    box-shadow: var(--border-r), var(--border-ri);
  }
  .dropzone {
    background: var(--field-bg);
    box-shadow: var(--border-s), var(--border-si);
    padding: 28px 16px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
  }
  .dropzone.drag { box-shadow: var(--border-s), var(--border-si), 0 0 0 2px var(--accent); }
  .file-list { list-style: none; padding: 0; margin: 12px 0 0; font-size: 12px; }
  .file-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 8px; margin-bottom: 4px;
    background: var(--face);
    box-shadow: var(--border-r), var(--border-ri);
  }
  .file-list button.remove {
    background: var(--surface); border: none; box-shadow: var(--border-r), var(--border-ri);
    color: var(--danger); cursor: pointer; font-size: 11px; padding: 2px 8px; font-family: inherit;
  }
  .file-list button.remove:active { box-shadow: var(--border-s), var(--border-si); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.primary, button.secondary {
    flex: 1 1 220px;
    padding: 8px 14px;
    border: none;
    background: var(--surface);
    box-shadow: var(--border-r), var(--border-ri);
    font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    color: var(--text);
  }
  button.primary:hover, button.secondary:hover { background: var(--highlight); }
  button.primary:active, button.secondary:active { box-shadow: var(--border-s), var(--border-si); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost {
    background: var(--surface); box-shadow: var(--border-r), var(--border-ri); color: var(--text);
    padding: 4px 10px; font-size: 11px; cursor: pointer; border: none; font-family: inherit;
  }
  button.ghost:active { box-shadow: var(--border-s), var(--border-si); }
  .result-item {
    display: flex; gap: 12px; align-items: center;
    padding: 8px; margin-bottom: 6px;
    background: var(--face);
    box-shadow: var(--border-r), var(--border-ri);
  }
  .result-item img { width: 48px; height: 48px; object-fit: contain; background: repeating-conic-gradient(#e5c8c8 0% 25%, #fffafb 0% 50%) 50% / 12px 12px; box-shadow: var(--border-s), var(--border-si); }
  .result-info { flex: 1; font-size: 12px; }
  .result-info .name { font-weight: 700; word-break: break-all; }
  .result-info .meta { color: var(--text-dim); }
  .result-info .meta.warn { color: var(--danger); }
  a.download {
    background: var(--surface);
    box-shadow: var(--border-r), var(--border-ri);
    color: var(--text); text-decoration: none;
    padding: 6px 12px; font-size: 12px; font-weight: 700;
    white-space: nowrap;
  }
  a.download:active { box-shadow: var(--border-s), var(--border-si); }
  #status { font-size: 12px; color: var(--text-dim); margin-top: 8px; min-height: 18px; }
  #status.error { color: var(--danger); }
  input[type=file] { display: none; }
  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 24px; line-height: 1.8; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar"><h1>이미지 30x30 / 500KB 변환기</h1></div>
  <p class="desc">PNG · JPG · GIF(애니메이션 포함)를 30x30px로 리사이즈하거나, 원본 해상도를 최대한 유지하면서 500KB 이하로 압축합니다. 모든 처리는 브라우저 안에서만 이루어지며 파일은 서버로 전송되지 않습니다.</p>

  <div class="card">
    <div class="card-title"><span>파일 선택</span></div>
    <div class="dropzone" id="dropzone">
      이미지를 여기로 끌어다 놓거나 클릭해서 선택하세요<br />
      <small>(PNG, JPG, GIF · 여러 개 선택 가능)</small>
    </div>
    <input type="file" id="fileInput" multiple accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif" />
    <ul class="file-list" id="fileList"></ul>

    <div class="actions">
      <button class="primary" id="btnResize">30x30 변환</button>
      <button class="secondary" id="btnCompress">500KB 이하로 압축 (고화질 우선)</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="resultsCard" style="display:none;">
    <div class="card-title">
      <span>결과</span>
      <button class="ghost" id="btnClearResults">결과 지우기</button>
    </div>
    <div id="results"></div>
  </div>

  <footer>브라우저에서 동작하는 정적 페이지입니다 · 소스: index.html</footer>
</div>

<script type="module">
const TARGET_SIZE = 30;
const MAX_BYTES = 500 * 1024;
const GIFUCT_URL = "https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/+esm";
const GIF_WORKER_URL = "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";

// ---------- 상태 ----------
let selectedFiles = [];
const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const fileListEl = document.getElementById("fileList");
const statusEl = document.getElementById("status");
const resultsCard = document.getElementById("resultsCard");
const resultsEl = document.getElementById("results");

dropzone.addEventListener("click", () => fileInput.click());
["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); })
);
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
);
dropzone.addEventListener("drop", e => addFiles(e.dataTransfer.files));
fileInput.addEventListener("change", () => addFiles(fileInput.files));

function addFiles(fileListLike) {
  const accepted = /\.(png|jpe?g|gif)$/i;
  for (const f of fileListLike) {
    if (!accepted.test(f.name)) continue;
    if (selectedFiles.some(s => s.name === f.name && s.size === f.size && s.lastModified === f.lastModified)) continue;
    selectedFiles.push(f);
  }
  renderFileList();
}

function renderFileList() {
  fileListEl.innerHTML = "";
  selectedFiles.forEach((f, idx) => {
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.textContent = `${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
    const removeBtn = document.createElement("button");
    removeBtn.className = "remove";
    removeBtn.textContent = "삭제";
    removeBtn.onclick = () => { selectedFiles.splice(idx, 1); renderFileList(); };
    li.appendChild(label);
    li.appendChild(removeBtn);
    fileListEl.appendChild(li);
  });
}

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

// ---------- 공통 캔버스 유틸 ----------
function drawToCanvas(source, w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(source, 0, 0, w, h);
  return canvas;
}

function canvasToBlob(canvas, type, quality) {
  return new Promise(resolve => canvas.toBlob(resolve, type, quality));
}

function* downscaleSteps(w, h, factor = 0.85, minDim = 16) {
  let scale = 1;
  while (true) {
    scale *= factor;
    const nw = Math.max(Math.round(w * scale), 1);
    const nh = Math.max(Math.round(h * scale), 1);
    if (Math.min(nw, nh) < minDim) return;
    yield [nw, nh];
  }
}

async function jpegUnderLimit(canvas, qualities) {
  let last = null;
  for (const q of qualities) {
    const blob = await canvasToBlob(canvas, "image/jpeg", q);
    last = blob;
    if (blob.size <= MAX_BYTES) return blob;
  }
  return last;
}

// ---------- PNG / JPG 처리 ----------
function isJpeg(file) {
  return /\.jpe?g$/i.test(file.name) || file.type === "image/jpeg";
}
function isGif(file) {
  return /\.gif$/i.test(file.name) || file.type === "image/gif";
}

async function compressKeepSize(bitmap, mime, jpeg) {
  const w0 = bitmap.width, h0 = bitmap.height;
  let canvas = drawToCanvas(bitmap, w0, h0);

  if (jpeg) {
    const blob = await jpegUnderLimit(canvas, [0.95, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5, 0.45, 0.4]);
    if (blob.size <= MAX_BYTES) return { blob, width: w0, height: h0 };
  } else {
    const blob = await canvasToBlob(canvas, mime);
    if (blob.size <= MAX_BYTES) return { blob, width: w0, height: h0 };
  }

  let lastBlob = null, lastW = w0, lastH = h0;
  for (const [w, h] of downscaleSteps(w0, h0)) {
    canvas = drawToCanvas(bitmap, w, h);
    if (jpeg) {
      for (const q of [0.85, 0.7, 0.55, 0.4]) {
        const blob = await canvasToBlob(canvas, "image/jpeg", q);
        lastBlob = blob; lastW = w; lastH = h;
        if (blob.size <= MAX_BYTES) return { blob, width: w, height: h };
      }
    } else {
      const blob = await canvasToBlob(canvas, mime);
      lastBlob = blob; lastW = w; lastH = h;
      if (blob.size <= MAX_BYTES) return { blob, width: w, height: h };
    }
  }

  if (jpeg) {
    const blob = await canvasToBlob(canvas, "image/jpeg", 0.2);
    return { blob, width: lastW, height: lastH };
  }
  return { blob: lastBlob, width: lastW, height: lastH };
}

async function processStatic(file, resize) {
  const bitmap = await createImageBitmap(file);
  const jpeg = isJpeg(file);
  const mime = jpeg ? "image/jpeg" : "image/png";
  const ext = jpeg ? "jpg" : "png";

  let result;
  if (resize) {
    const canvas = drawToCanvas(bitmap, TARGET_SIZE, TARGET_SIZE);
    const blob = jpeg
      ? await jpegUnderLimit(canvas, [0.92, 0.8, 0.6])
      : await canvasToBlob(canvas, mime);
    result = { blob, width: TARGET_SIZE, height: TARGET_SIZE };
  } else {
    result = await compressKeepSize(bitmap, mime, jpeg);
  }
  if (bitmap.close) bitmap.close();
  return { ...result, ext, suffix: resize ? "30x30" : "500kb" };
}

// ---------- GIF 처리 ----------
let gifuctModulePromise = null;
function loadGifuct() {
  if (!gifuctModulePromise) gifuctModulePromise = import(/* @vite-ignore */ GIFUCT_URL);
  return gifuctModulePromise;
}

let gifWorkerUrlPromise = null;
function getGifWorkerUrl() {
  if (!gifWorkerUrlPromise) {
    gifWorkerUrlPromise = fetch(GIF_WORKER_URL)
      .then(r => r.text())
      .then(text => URL.createObjectURL(new Blob([text], { type: "application/javascript" })));
  }
  return gifWorkerUrlPromise;
}

async function decodeGif(file) {
  const { parseGIF, decompressFrames } = await loadGifuct();
  const buf = await file.arrayBuffer();
  const gifData = parseGIF(buf);
  const rawFrames = decompressFrames(gifData, true);
  const width = gifData.lsd.width;
  const height = gifData.lsd.height;

  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext("2d");

  const composited = [];
  let savedForRestore = null;
  let prevDisposal = 0;
  let prevDims = null;

  for (const frame of rawFrames) {
    if (prevDisposal === 2 && prevDims) {
      ctx.clearRect(prevDims.left, prevDims.top, prevDims.width, prevDims.height);
    } else if (prevDisposal === 3 && savedForRestore) {
      ctx.putImageData(savedForRestore, 0, 0);
    }

    if (frame.disposalType === 3) {
      savedForRestore = ctx.getImageData(0, 0, width, height);
    }

    const patchImageData = new ImageData(new Uint8ClampedArray(frame.patch), frame.dims.width, frame.dims.height);
    const patchCanvas = document.createElement("canvas");
    patchCanvas.width = frame.dims.width;
    patchCanvas.height = frame.dims.height;
    patchCanvas.getContext("2d").putImageData(patchImageData, 0, 0);
    ctx.drawImage(patchCanvas, frame.dims.left, frame.dims.top);

    const frameCanvas = document.createElement("canvas");
    frameCanvas.width = width; frameCanvas.height = height;
    frameCanvas.getContext("2d").drawImage(canvas, 0, 0);
    composited.push({ canvas: frameCanvas, delay: frame.delay || 100 });

    prevDisposal = frame.disposalType;
    prevDims = frame.dims;
  }

  return { width, height, frames: composited };
}

function frameHasAlpha(canvas) {
  const ctx = canvas.getContext("2d");
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < data.length; i += 4 * 13) {
    if (data[i] < 250) return true;
  }
  return false;
}

function pickTransparentColor(frames) {
  const candidates = [[255, 0, 255], [0, 255, 0], [0, 255, 255], [255, 255, 0], [128, 0, 128]];
  const used = new Set();
  for (const f of frames) {
    const ctx = f.canvas.getContext("2d");
    const data = ctx.getImageData(0, 0, f.canvas.width, f.canvas.height).data;
    for (let i = 0; i < data.length; i += 4 * 29) {
      if (data[i + 3] > 10) used.add(data[i] + "," + data[i + 1] + "," + data[i + 2]);
    }
  }
  for (const c of candidates) {
    if (!used.has(c.join(","))) return c;
  }
  return candidates[0];
}

function applyChromaKeyInPlace(canvas, color) {
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 128) {
      d[i] = color[0]; d[i + 1] = color[1]; d[i + 2] = color[2]; d[i + 3] = 255;
    } else {
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function cloneFrames(frames, w, h) {
  return frames.map(f => ({ canvas: drawToCanvas(f.canvas, w, h), delay: f.delay }));
}

function prepFramesForEncode(frames, keyColor) {
  return frames.map(f => {
    const c = document.createElement("canvas");
    c.width = f.canvas.width; c.height = f.canvas.height;
    c.getContext("2d").drawImage(f.canvas, 0, 0);
    if (keyColor) applyChromaKeyInPlace(c, keyColor);
    return { canvas: c, delay: f.delay };
  });
}

function rgbToHexNum([r, g, b]) {
  return (r << 16) | (g << 8) | b;
}

async function encodeGif(frames, width, height, transparentColor) {
  const workerScript = await getGifWorkerUrl();
  return new Promise((resolve, reject) => {
    const gif = new GIF({
      workers: 2,
      quality: 10,
      width, height,
      workerScript,
      transparent: transparentColor ? rgbToHexNum(transparentColor) : undefined,
    });
    for (const f of frames) gif.addFrame(f.canvas, { delay: f.delay, copy: true });
    gif.on("finished", resolve);
    gif.on("abort", () => reject(new Error("GIF 인코딩이 중단되었습니다")));
    gif.render();
  });
}

async function processGif(file, resize) {
  const { width, height, frames } = await decodeGif(file);
  const hasAlpha = frames.some(f => frameHasAlpha(f.canvas));
  const transparentColor = hasAlpha ? pickTransparentColor(frames) : null;

  if (resize) {
    const resized = cloneFrames(frames, TARGET_SIZE, TARGET_SIZE);
    const prepped = prepFramesForEncode(resized, transparentColor);
    const blob = await encodeGif(prepped, TARGET_SIZE, TARGET_SIZE, transparentColor);
    return { blob, width: TARGET_SIZE, height: TARGET_SIZE, ext: "gif", suffix: "30x30" };
  }

  // 1) 원본 해상도로 시도
  let prepped = prepFramesForEncode(frames, transparentColor);
  let blob = await encodeGif(prepped, width, height, transparentColor);
  if (blob.size <= MAX_BYTES) return { blob, width, height, ext: "gif", suffix: "500kb" };

  // 2) 해상도를 낮춰가며 재시도 (색은 그대로 최대 256색 유지)
  let curFrames = frames, lastBlob = blob, lastW = width, lastH = height;
  for (const [w, h] of downscaleSteps(width, height)) {
    curFrames = cloneFrames(frames, w, h);
    prepped = prepFramesForEncode(curFrames, transparentColor);
    blob = await encodeGif(prepped, w, h, transparentColor);
    lastBlob = blob; lastW = w; lastH = h;
    if (blob.size <= MAX_BYTES) return { blob, width: w, height: h, ext: "gif", suffix: "500kb" };
  }

  // 3) 마지막 수단: 프레임 수를 줄인다
  let frameSet = curFrames;
  while (frameSet.length > 1) {
    frameSet = frameSet.filter((_, i) => i % 2 === 0);
    prepped = prepFramesForEncode(frameSet, transparentColor);
    blob = await encodeGif(prepped, lastW, lastH, transparentColor);
    lastBlob = blob;
    if (blob.size <= MAX_BYTES) return { blob, width: lastW, height: lastH, ext: "gif", suffix: "500kb" };
  }

  return { blob: lastBlob, width: lastW, height: lastH, ext: "gif", suffix: "500kb" };
}

// ---------- 실행 ----------
async function processFile(file, resize) {
  if (isGif(file)) return await processGif(file, resize);
  return await processStatic(file, resize);
}

function baseName(name) {
  const idx = name.lastIndexOf(".");
  return idx === -1 ? name : name.slice(0, idx);
}

function addResult(file, outcome, error) {
  resultsCard.style.display = "block";
  const item = document.createElement("div");
  item.className = "result-item";

  if (error) {
    item.innerHTML = `<div class="result-info"><div class="name">${file.name}</div><div class="meta warn">실패: ${error.message}</div></div>`;
    resultsEl.appendChild(item);
    return;
  }

  const { blob, width, height, ext, suffix } = outcome;
  const outName = `${baseName(file.name)}_${suffix}.${ext}`;
  const url = URL.createObjectURL(blob);
  const sizeKb = (blob.size / 1024).toFixed(1);
  const overLimit = blob.size > MAX_BYTES;

  const img = document.createElement("img");
  img.src = url;

  const info = document.createElement("div");
  info.className = "result-info";
  info.innerHTML = `<div class="name">${outName}</div>
    <div class="meta ${overLimit ? "warn" : ""}">${width}x${height}px · ${sizeKb} KB${overLimit ? " (500KB 초과)" : ""}</div>`;

  const link = document.createElement("a");
  link.className = "download";
  link.href = url;
  link.download = outName;
  link.textContent = "다운로드";

  item.appendChild(img);
  item.appendChild(info);
  item.appendChild(link);
  resultsEl.appendChild(item);
}

async function runConvert(resize) {
  if (selectedFiles.length === 0) {
    setStatus("변환할 파일을 먼저 추가하세요.", true);
    return;
  }
  btnResize.disabled = true;
  btnCompress.disabled = true;
  let done = 0, failed = 0;
  for (const file of selectedFiles) {
    setStatus(`처리 중... (${done + failed + 1}/${selectedFiles.length}) ${file.name}`);
    try {
      const outcome = await processFile(file, resize);
      addResult(file, outcome);
      done++;
    } catch (e) {
      console.error(e);
      addResult(file, null, e);
      failed++;
    }
  }
  setStatus(`완료: ${done}개 / 실패: ${failed}개`, failed > 0);
  btnResize.disabled = false;
  btnCompress.disabled = false;
}
